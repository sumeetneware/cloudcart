services:

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile

    image: gateway:v1

    container_name: gateway

    ports:
      - "80:80"

    depends_on:
      auth-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      user-service:
        condition: service_healthy

    networks:
      - cloudcart-network

  product-service:
    build:
      context: ./services/product-service

    image: product-service:v1

    container_name: product-service

    ports:
      - "3003:3003"

    env_file:
      - ./services/product-service/.env

    networks:
      - cloudcart-network

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  user-service:
    build:
      context: ./services/user-service

    image: user-service:v1

    container_name: user-service

    ports:
      - "3004:3004"

    env_file:
      - ./services/user-service/.env

    networks:
      - cloudcart-network

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3004/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  auth-service:
    build:
      context: ./services/auth-service

    image: auth-service:v1

    container_name: auth-service

    ports:
      - "3005:3005"

    env_file:
      - ./services/auth-service/.env

    networks:
      - cloudcart-network

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cart-service:
    build:
      context: ./services/cart-service

    image: cart-service:v1

    container_name: cart-service

    ports:
      - "3006:3006"

    env_file:
      - ./services/cart-service/.env

    networks:
      - cloudcart-network

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3006/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  order-service:
    build:
      context: ./services/order-service

    image: order-service:v1

    container_name: order-service

    ports:
      - "3007:3007"

    env_file:
      - ./services/order-service/.env

    networks:
      - cloudcart-network

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3007/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  cloudcart-network:
